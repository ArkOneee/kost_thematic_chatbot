<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Chatbot Kos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e3a8a, #0f172a, #020617);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        /* Efek transisi halaman */
        .page-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div id="app" class="glass p-8 rounded-2xl max-w-md w-full text-center relative overflow-hidden page-transition opacity-0 scale-95">
        <!-- Efek cahaya dekoratif -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl"></div>

        <div class="relative z-10">
            <div class="w-16 h-16 bg-blue-600/30 border border-blue-400/30 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner text-3xl">
                🏡
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">Portal <span class="text-blue-400">KosBot</span></h1>
            <p class="text-sm text-slate-300 mb-8">Asisten cerdas layanan, fasilitas, dan pelaporan kamar kos Anda.</p>

            {% for t in themes %}
            <a href="/chat/{{ t.id }}" id="btn-chat" class="w-full group relative inline-flex items-center justify-center px-8 py-3.5 text-base font-semibold text-white bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl overflow-hidden shadow-lg shadow-blue-500/30 transition-all duration-300 hover:scale-[1.02] hover:shadow-blue-500/50 active:scale-95">
                <span class="absolute inset-0 w-full h-full bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></span>
                Mulai Obrolan dengan {{ t.bot_name }}
            </a>
            {% endfor %}
        </div>
    </div>

    <script>
        // Efek muncul saat halaman pertama dibuka (Fade In)
        window.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            app.classList.remove('opacity-0', 'scale-95');
            app.classList.add('opacity-100', 'scale-100');
        });

        // Efek halus saat tombol ditekan sebelum pindah halaman
        const btnChat = document.getElementById('btn-chat');
        if (btnChat) {
            btnChat.addEventListener('click', (e) => {
                e.preventDefault();
                const targetUrl = btnChat.getAttribute('href');
                const app = document.getElementById('app');
                
                // Efek memudar keluar (Fade Out & Zoom Out)
                app.classList.remove('opacity-100', 'scale-100');
                app.classList.add('opacity-0', 'scale-95');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 400); // Waktu jeda sesuai durasi transisi CSS
            });
        }
    </script>
</body>
</html>
