<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - {{ theme.bot_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #1e293b, #0f172a, #020617);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glass-header {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
        }
        /* Efek transisi halaman */
        .page-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        /* Kustomisasi Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-0 sm:p-4">

    <div id="chat-wrapper" class="glass-panel w-full max-w-2xl h-full sm:h-[90vh] flex flex-col sm:rounded-2xl overflow-hidden relative page-transition opacity-0 translate-y-4">
        
        <!-- Header -->
        <div class="glass-header px-6 py-4 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-xl shadow-inner">
                    🤖
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">{{ theme.bot_name }}</h1>
                    <p class="text-xs text-blue-400 font-medium">Online • Siap Membantu</p>
                </div>
            </div>
            <a href="/" id="btn-back" class="px-4 py-2 text-xs font-semibold text-slate-300 bg-slate-800/80 hover:bg-blue-600 hover:text-white rounded-lg border border-slate-700/60 transition-all duration-200">
                Kembali
            </a>
        </div>

        <!-- Area Pesan Chat -->
        <div id="chat-container" class="flex-grow p-6 overflow-y-auto flex flex-col gap-4">
            <!-- Sapaan Awal Bot -->
            <div class="flex items-end gap-2 max-w-[85%]">
                <div class="w-8 h-8 rounded-lg bg-blue-600/30 border border-blue-400/30 flex items-center justify-center text-sm flex-shrink-0 mb-1">🤖</div>
                <div class="p-4 rounded-2xl rounded-bl-sm bg-slate-800/80 border border-slate-700/50 text-slate-100 text-sm shadow-md leading-relaxed">
                    Halo! Saya {{ theme.bot_name }}, asisten pengelola kos. Silakan tanyakan soal fasilitas, pembayaran sewa, aturan jam malam, laporan kerusakan, izin tamu, atau WiFi.
                </div>
            </div>
        </div>

        <!-- Form Input Chat -->
        <div class="p-4 glass-header z-10">
            <form id="chat-form" class="flex gap-3 items-center">
                <input type="text" id="chat-input" placeholder="Ketik pesan atau pertanyaan Anda di sini..." autocomplete="off"
                    class="flex-grow bg-slate-900/80 text-white text-sm px-5 py-3.5 rounded-xl border border-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-500">
                <button type="submit" 
                    class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold px-6 py-3.5 rounded-xl text-sm shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:scale-[1.02] active:scale-95 transition-all flex-shrink-0">
                    Kirim
                </button>
            </form>
        </div>

    </div>

    <script>
        const themeId = "{{ theme.id }}";
        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        // Efek animasi masuk halaman chat
        window.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('chat-wrapper');
            wrapper.classList.remove('opacity-0', 'translate-y-4');
            wrapper.classList.add('opacity-100', 'translate-y-0');
            loadHistory();
        });

        // Efek animasi keluar saat tombol kembali ditekan
        const btnBack = document.getElementById('btn-back');
        btnBack.addEventListener('click', (e) => {
            e.preventDefault();
            const targetUrl = btnBack.getAttribute('href');
            const wrapper = document.getElementById('chat-wrapper');

            wrapper.classList.remove('opacity-100', 'translate-y-0');
            wrapper.classList.add('opacity-0', 'translate-y-4');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 400);
        });

        // Fungsi otomatis ambil riwayat chat saat halaman dibuka
        async function loadHistory() {
            try {
                const res = await fetch(`/api/history/${themeId}`);
                const data = await res.json();
                if (data.length > 0) {
                    chatContainer.innerHTML = ''; 
                    data.forEach(msg => {
                        appendMessage(msg.sender === 'user' ? 'user' : 'bot', msg.text);
                    });
                }
            } catch (err) {
                console.error("Gagal memuat riwayat:", err);
            }
        }

        // Fungsi menambah gelembung pesan ke layar
        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-end gap-2 max-w-[85%] ${isUser ? 'ml-auto flex-row-reverse' : ''}`;

            if (!isUser) {
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-lg bg-blue-600/30 border border-blue-400/30 flex items-center justify-center text-sm flex-shrink-0 mb-1';
                avatar.innerHTML = '🤖';
                wrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-2xl text-sm shadow-md leading-relaxed ${
                isUser 
                    ? 'bg-blue-600 text-white rounded-br-sm shadow-blue-500/20' 
                    : 'bg-slate-800/80 border border-slate-700/50 text-slate-100 rounded-bl-sm'
            }`;
            bubble.textContent = text;
            wrapper.appendChild(bubble);

            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Event saat form dikirim
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            chatInput.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, theme: themeId })
                });
                const data = await res.json();

                if (!res.ok) {
                    appendMessage('bot', data.error || 'Terjadi kesalahan sistem.');
                } else {
                    appendMessage('bot', data.reply);
                }
            } catch (err) {
                appendMessage('bot', 'Gagal terhubung ke server.');
            }
        });
    </script>
</body>
</html>
